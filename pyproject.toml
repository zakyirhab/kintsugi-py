[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kintsugi-py"
version = "0.2.0"
description = "Self-healing Python functions powered by Universal LLMs. Zero-downtime execution with AST safety and in-memory hot-swapping."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Zaky Irhab", email = "emailmeforbussiness@zakyirhab.it.com" }
]
keywords = [
    "self-healing",
    "resilience",
    "llm",
    "metaprogramming",
    "hot-swap",
    "pydantic",
    "scraping",
    "data-engineering",
    "ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/zakyirhab/kintsugi-py"
Documentation = "https://github.com/zakyirhab/kintsugi-py#readme"
Repository = "https://github.com/zakyirhab/kintsugi-py"
Issues = "https://github.com/zakyirhab/kintsugi-py/issues"
Changelog = "https://github.com/zakyirhab/kintsugi-py/releases"

[tool.hatch.build.targets.wheel]
packages = ["kintsugi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "demo_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
